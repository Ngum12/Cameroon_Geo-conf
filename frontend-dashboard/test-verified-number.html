<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Verified Number</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff88;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1a1a2e;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #00ff88;
        }
        h1 {
            text-align: center;
            color: #ff1744;
            text-shadow: 0 0 10px #ff1744;
        }
        button {
            background: #ff1744;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
            width: 100%;
        }
        button:hover {
            background: #d50000;
            transform: scale(1.02);
        }
        .success-btn {
            background: #4caf50;
        }
        .success-btn:hover {
            background: #388e3c;
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .warning { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 TEST VERIFIED NUMBER</h1>
        
        <div class="status success">
            ✅ Number +250792104982 is now verified in Twilio!
        </div>
        
        <button onclick="testSMS()" class="success-btn">📱 TEST SMS TO VERIFIED NUMBER</button>
        <button onclick="testWhatsApp()" class="success-btn">💬 TEST WHATSAPP TO VERIFIED NUMBER</button>
        <button onclick="testBoth()">🚀 TEST BOTH SMS & WHATSAPP</button>
        <button onclick="clearLog()">🧹 CLEAR LOG</button>
        
        <div id="log" class="log"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            logDiv.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function testSMS() {
            log('📱 Testing SMS to verified number +250792104982...', 'info');
            
            try {
                const response = await fetch('/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: '+250792104982',
                        body: '🧪 SMS TEST - Verified number test from Communications Hub',
                        channel: 'sms'
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    log(`✅ SMS sent successfully!`, 'success');
                    log(`   SID: ${result.sid}`, 'success');
                    log(`   Status: ${result.status}`, 'success');
                    log('📱 Check your phone for SMS message!', 'success');
                } else {
                    const error = await response.json();
                    log(`❌ SMS failed: ${error.error}`, 'error');
                }

            } catch (error) {
                log(`❌ SMS test error: ${error.message}`, 'error');
            }
        }

        async function testWhatsApp() {
            log('💬 Testing WhatsApp to verified number +250792104982...', 'info');
            
            try {
                const response = await fetch('/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: 'whatsapp:+250792104982',
                        body: '🧪 WHATSAPP TEST - Verified number test from Communications Hub',
                        channel: 'whatsapp'
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    log(`✅ WhatsApp sent successfully!`, 'success');
                    log(`   SID: ${result.sid}`, 'success');
                    log(`   Status: ${result.status}`, 'success');
                    log('💬 Check your phone for WhatsApp message!', 'success');
                } else {
                    const error = await response.json();
                    log(`❌ WhatsApp failed: ${error.error}`, 'error');
                }

            } catch (error) {
                log(`❌ WhatsApp test error: ${error.message}`, 'error');
            }
        }

        async function testBoth() {
            log('🚀 Testing both SMS and WhatsApp to verified number...', 'info');
            log('', 'info');
            
            await testSMS();
            
            // Wait a bit between tests
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            await testWhatsApp();
            
            log('', 'info');
            log('🎯 Both tests completed!', 'success');
            log('📱 Check your phone for both SMS and WhatsApp messages', 'success');
        }

        function clearLog() {
            document.getElementById('log').textContent = '';
        }

        // Auto-load message
        window.addEventListener('load', () => {
            log('📱 Verified Number Test Tool Loaded', 'info');
            log('', 'info');
            log('✅ Number +250792104982 is verified in Twilio', 'success');
            log('✅ Both SMS and WhatsApp should now work', 'success');
            log('', 'info');
            log('🎯 Ready to test verified number!', 'success');
        });
    </script>
</body>
</html>
