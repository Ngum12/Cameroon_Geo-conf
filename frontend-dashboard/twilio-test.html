<!DOCTYPE html>
<html>
<head>
    <title>🧪 Twilio Frontend Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        .success { color: green; }
        .error { color: red; }
        #log { background: #f0f0f0; padding: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🎯 Harmony Flow - Frontend Twilio Test</h1>
    
    <button onclick="testBackendConnection()">🔗 Test Backend Connection</button>
    <button onclick="sendTestSMS()">📱 Send Test SMS</button>
    <button onclick="sendTestWhatsApp()">💬 Send Test WhatsApp</button>
    
    <div id="status"></div>
    <div id="log"></div>
    
    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const statusDiv = document.getElementById('status');
            const timestamp = new Date().toLocaleTimeString();
            
            logDiv.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
            statusDiv.innerHTML = `<div class="${type}">${message}</div>`;
            
            console.log(message);
        }
        
        async function testBackendConnection() {
            log('🧪 Testing backend connection...', 'info');
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/twilio/status');
                
                if (response.ok) {
                    const result = await response.json();
                    log('✅ Backend connection successful!', 'success');
                    log(`Account SID: ${result.account_sid}`, 'info');
                    log(`SMS Number: ${result.sms_number}`, 'info');
                } else {
                    log(`❌ Backend connection failed: ${response.status}`, 'error');
                }
            } catch (error) {
                log(`❌ Network error: ${error.message}`, 'error');
                log('💡 Make sure Django server is running on port 8000', 'info');
            }
        }
        
        async function sendTestSMS() {
            log('📱 Sending test SMS...', 'info');
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        to: '+250792104982',
                        body: '🧪 FRONTEND TEST from Harmony Flow Dashboard\\n\\nFrontend → Backend → Twilio integration working!\\n\\n✅ Ready for ML demonstration',
                        channel: 'sms'
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    log(`✅ SMS sent successfully! SID: ${result.sid}`, 'success');
                    log('📱 Check your phone for the message!', 'success');
                } else {
                    const error = await response.json();
                    log(`❌ SMS failed: ${error.error}`, 'error');
                }
            } catch (error) {
                log(`❌ SMS error: ${error.message}`, 'error');
            }
        }
        
        async function sendTestWhatsApp() {
            log('💬 Sending test WhatsApp...', 'info');
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        to: 'whatsapp:+250792104982',
                        body: '🧪 WHATSAPP TEST from Harmony Flow Dashboard\\n\\n🎯 Frontend → Backend → Twilio integration working!\\n\\n✅ Ready for ML demonstration',
                        channel: 'whatsapp'
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    log(`✅ WhatsApp sent successfully! SID: ${result.sid}`, 'success');
                    log('💬 Check your WhatsApp for the message!', 'success');
                } else {
                    const error = await response.json();
                    log(`❌ WhatsApp failed: ${error.error}`, 'error');
                }
            } catch (error) {
                log(`❌ WhatsApp error: ${error.message}`, 'error');
            }
        }
        
        // Auto-test on load
        window.onload = function() {
            log('🎯 Harmony Flow Twilio Test Page Loaded', 'info');
            log('💡 Click buttons above to test integration', 'info');
        };
    </script>
</body>
</html>
