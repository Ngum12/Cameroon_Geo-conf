<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communications Hub - Real Twilio Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff88;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1a1a2e;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #00ff88;
        }
        h1 {
            text-align: center;
            color: #ff1744;
            text-shadow: 0 0 10px #ff1744;
        }
        .test-section {
            background: #2a2a3e;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
        }
        button {
            background: #ff1744;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #d50000;
            transform: scale(1.05);
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .warning { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 COMMUNICATIONS HUB - REAL TWILIO TEST</h1>
        
        <div class="test-section">
            <h3>📱 Test Real Communications Hub Integration</h3>
            <p>This will test the actual Communications Hub service with real Twilio API calls.</p>
            
            <button onclick="testRealCommunicationsHub()">🚨 SEND REAL ALERT VIA COMMS HUB</button>
            <button onclick="testDirectTwilio()">📞 DIRECT TWILIO TEST</button>
            <button onclick="clearLog()">🧹 CLEAR LOG</button>
            
            <div id="status"></div>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            logDiv.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function setStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }

        async function testRealCommunicationsHub() {
            log('🚨 Testing Real Communications Hub Integration...', 'info');
            setStatus('Testing Communications Hub...', 'warning');

            try {
                // Create a test alert message (simulating what the Communications Hub does)
                const testAlert = {
                    id: `test-alert-${Date.now()}`,
                    title: '🚨 CAMEROON DEFENSE ALERT - COMMUNICATIONS HUB TEST',
                    message: `THREAT SUMMARY: Communications Hub Integration Test

REGION: Test Region
THREAT LEVEL: 95%
VERIFICATION: HUMAN EXPERT VERIFIED

DETAILS: This is a test of the Communications Hub real Twilio integration. The system is now sending actual SMS and WhatsApp messages instead of mock data.

PRIORITY: IMMEDIATE RESPONSE REQUIRED
TIME: ${new Date().toLocaleString()}

This alert has been verified by human intelligence analyst.

Project Sentinel Defense Intelligence Platform
Cameroon Defense Force`,
                    urgency: 'critical',
                    category: 'security_threat',
                    timestamp: new Date(),
                    region: 'Test Region'
                };

                log('📡 Simulating Communications Hub alert sending...', 'info');

                // Test both SMS and WhatsApp via backend API
                const testNumber = '+250792104984';
                
                // Test SMS
                log(`📱 Sending SMS to ${testNumber}...`, 'info');
                const smsResponse = await fetch('/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: testNumber,
                        body: testAlert.message,
                        channel: 'sms'
                    })
                });

                if (smsResponse.ok) {
                    const smsResult = await smsResponse.json();
                    log(`✅ SMS sent successfully! SID: ${smsResult.sid}`, 'success');
                } else {
                    const smsError = await smsResponse.json();
                    log(`❌ SMS failed: ${smsError.error}`, 'error');
                }

                // Test WhatsApp
                log(`💬 Sending WhatsApp to ${testNumber}...`, 'info');
                const whatsappResponse = await fetch('/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: `whatsapp:${testNumber}`,
                        body: testAlert.message,
                        channel: 'whatsapp'
                    })
                });

                if (whatsappResponse.ok) {
                    const whatsappResult = await whatsappResponse.json();
                    log(`✅ WhatsApp sent successfully! SID: ${whatsappResult.sid}`, 'success');
                } else {
                    const whatsappError = await whatsappResponse.json();
                    log(`❌ WhatsApp failed: ${whatsappError.error}`, 'error');
                }

                setStatus('✅ Communications Hub test completed! Check your phone!', 'success');
                log('🎉 Communications Hub real integration test completed!', 'success');
                log('📞 Check your phone for SMS and WhatsApp messages!', 'success');

            } catch (error) {
                log(`❌ Communications Hub test failed: ${error.message}`, 'error');
                setStatus('❌ Test failed - check console for details', 'error');
            }
        }

        async function testDirectTwilio() {
            log('📞 Testing Direct Twilio API...', 'info');
            setStatus('Testing Direct Twilio...', 'warning');

            try {
                const response = await fetch('/api/v1/twilio/test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    log(`✅ Direct Twilio test successful: ${JSON.stringify(result)}`, 'success');
                    setStatus('✅ Direct Twilio test passed!', 'success');
                } else {
                    const error = await response.json();
                    log(`❌ Direct Twilio test failed: ${JSON.stringify(error)}`, 'error');
                    setStatus('❌ Direct Twilio test failed', 'error');
                }
            } catch (error) {
                log(`❌ Direct Twilio error: ${error.message}`, 'error');
                setStatus('❌ Network error', 'error');
            }
        }

        function clearLog() {
            document.getElementById('log').textContent = '';
            document.getElementById('status').textContent = '';
        }

        // Auto-test on page load
        window.addEventListener('load', () => {
            log('🚀 Communications Hub Real Twilio Test Page Loaded', 'info');
            log('📱 Ready to test real Twilio integration!', 'info');
            log('🎯 Click "SEND REAL ALERT" to test the Communications Hub', 'info');
        });
    </script>
</body>
</html>
