<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updated Communications Hub Flow Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff88;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #1a1a2e;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #00ff88;
        }
        h1 {
            text-align: center;
            color: #ff1744;
            text-shadow: 0 0 10px #ff1744;
        }
        .test-section {
            background: #2a2a3e;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
        }
        button {
            background: #ff1744;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #d50000;
            transform: scale(1.05);
        }
        .approve-btn {
            background: #4caf50;
        }
        .approve-btn:hover {
            background: #388e3c;
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .warning { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 UPDATED COMMUNICATIONS HUB FLOW TEST</h1>
        
        <div class="test-section">
            <h3>🎯 Test Human-Approved Threat Display</h3>
            <p>This tests that approved threats now appear in the Communications Hub list AND can be sent as alerts.</p>
            
            <button onclick="simulateHumanApproval()" class="approve-btn">✅ SIMULATE HUMAN APPROVAL</button>
            <button onclick="testMultipleThreats()">📊 TEST MULTIPLE THREATS</button>
            <button onclick="clearLog()">🧹 CLEAR LOG</button>
            
            <div id="status"></div>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            logDiv.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function setStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }

        // Listen for Communications Hub events
        window.addEventListener('sentinel:navigate-comms-hub', (event) => {
            log('📡 Communications Hub received approved threat!', 'success');
            log(`   Threat: ${event.detail.title}`, 'info');
            log(`   Region: ${event.detail.region}`, 'info');
            log(`   Level: ${event.detail.threatLevel}%`, 'info');
            log(`   Status: ${event.detail.verificationStatus}`, 'info');
            log('', 'info');
            log('✅ Threat should now appear in Communications Hub list!', 'success');
            log('📱 Go to Communications Hub to see the approved threat and send alert', 'warning');
        });

        function simulateHumanApproval() {
            log('👤 Simulating Human-in-Loop approval...', 'info');
            setStatus('Simulating human approval...', 'warning');

            const approvedThreat = {
                notificationId: `threat-${Date.now()}`,
                title: 'VERIFIED THREAT: Border Security Incident',
                region: 'Far North',
                threatLevel: 92,
                description: `HUMAN VERIFIED: Critical border security situation detected requiring immediate response.

Analyst Confidence: 5/5
Notes: High-priority threat confirmed by multiple intelligence sources. Immediate coordination required.`,
                autoFill: true,
                verificationStatus: 'human_approved',
                urgency: 'critical'
            };

            setTimeout(() => {
                log('✅ THREAT APPROVED by human analyst!', 'success');
                log(`   Threat: ${approvedThreat.title}`, 'info');
                log(`   Region: ${approvedThreat.region}`, 'info');
                log(`   Level: ${approvedThreat.threatLevel}%`, 'info');
                log('', 'info');
                log('📡 Sending to Communications Hub...', 'warning');

                // Dispatch the event
                window.dispatchEvent(new CustomEvent('sentinel:navigate-comms-hub', {
                    detail: approvedThreat
                }));

                setStatus('✅ Approved threat sent to Communications Hub!', 'success');
            }, 2000);
        }

        function testMultipleThreats() {
            log('📊 Testing multiple approved threats...', 'info');
            setStatus('Testing multiple threats...', 'warning');

            const threats = [
                {
                    notificationId: `threat-${Date.now()}-1`,
                    title: 'VERIFIED THREAT: Extreme-Nord Security Alert',
                    region: 'Extreme-Nord',
                    threatLevel: 88,
                    description: 'HUMAN VERIFIED: Security situation in Extreme-Nord requiring immediate attention.',
                    verificationStatus: 'human_approved',
                    urgency: 'critical'
                },
                {
                    notificationId: `threat-${Date.now()}-2`,
                    title: 'VERIFIED THREAT: Sud-Ouest Border Activity',
                    region: 'Sud-Ouest',
                    threatLevel: 75,
                    description: 'HUMAN VERIFIED: Unusual border activity detected in Sud-Ouest region.',
                    verificationStatus: 'human_approved',
                    urgency: 'high'
                },
                {
                    notificationId: `threat-${Date.now()}-3`,
                    title: 'VERIFIED THREAT: Nord-Ouest Intelligence Alert',
                    region: 'Nord-Ouest',
                    threatLevel: 82,
                    description: 'HUMAN VERIFIED: Intelligence reports indicate elevated threat level in Nord-Ouest.',
                    verificationStatus: 'human_approved',
                    urgency: 'critical'
                }
            ];

            log(`📊 Approving ${threats.length} threats sequentially...`, 'info');

            threats.forEach((threat, index) => {
                setTimeout(() => {
                    log(`✅ Approving threat ${index + 1}: ${threat.title}`, 'success');
                    
                    window.dispatchEvent(new CustomEvent('sentinel:navigate-comms-hub', {
                        detail: threat
                    }));
                    
                    if (index === threats.length - 1) {
                        log('', 'info');
                        log('🎉 All threats approved and sent to Communications Hub!', 'success');
                        log('📡 Go to Communications Hub to see all approved threats', 'warning');
                        setStatus(`✅ ${threats.length} approved threats sent to Communications Hub!`, 'success');
                    }
                }, (index + 1) * 1500);
            });
        }

        function clearLog() {
            document.getElementById('log').textContent = '';
            document.getElementById('status').textContent = '';
        }

        // Auto-load message
        window.addEventListener('load', () => {
            log('🚀 Updated Communications Hub Flow Test Loaded', 'info');
            log('', 'info');
            log('UPDATED FLOW:', 'info');
            log('1. 👤 Human approves threat', 'info');
            log('2. 📡 Threat appears in Communications Hub list', 'info');
            log('3. 🎯 Click ALERT button on the threat', 'info');
            log('4. 📱 Configure and send real WhatsApp alert', 'info');
            log('', 'info');
            log('Click "SIMULATE HUMAN APPROVAL" to test!', 'info');
        });
    </script>
</body>
</html>
