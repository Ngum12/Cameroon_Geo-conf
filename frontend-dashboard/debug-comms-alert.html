<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Communications Hub Alert</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff88;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #1a1a2e;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #00ff88;
        }
        h1 {
            text-align: center;
            color: #ff1744;
            text-shadow: 0 0 10px #ff1744;
        }
        .test-section {
            background: #2a2a3e;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
        }
        button {
            background: #ff1744;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #d50000;
            transform: scale(1.05);
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .warning { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 DEBUG COMMUNICATIONS HUB ALERT</h1>
        
        <div class="test-section">
            <h3>🐛 Debug Alert Sending</h3>
            <p>This will test the Communications Hub alert sending step by step to find the issue.</p>
            
            <button onclick="testBackendAPI()">🔧 TEST BACKEND API</button>
            <button onclick="testAlertService()">📡 TEST ALERT SERVICE</button>
            <button onclick="testFullFlow()">🚀 TEST FULL FLOW</button>
            <button onclick="clearLog()">🧹 CLEAR LOG</button>
            
            <div id="status"></div>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            logDiv.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function setStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }

        async function testBackendAPI() {
            log('🔧 Testing backend Twilio API directly...', 'info');
            setStatus('Testing backend API...', 'warning');

            try {
                // Test WhatsApp
                log('💬 Testing WhatsApp via backend API...', 'info');
                const whatsappResponse = await fetch('/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: 'whatsapp:+250792104984',
                        body: 'DEBUG TEST - Backend API WhatsApp test from Communications Hub debug',
                        channel: 'whatsapp'
                    })
                });

                if (whatsappResponse.ok) {
                    const result = await whatsappResponse.json();
                    log(`✅ Backend WhatsApp API working!`, 'success');
                    log(`   SID: ${result.sid}`, 'success');
                    log(`   Status: ${result.status}`, 'success');
                } else {
                    const error = await whatsappResponse.json();
                    log(`❌ Backend WhatsApp API failed: ${error.error}`, 'error');
                }

                // Test SMS
                log('📱 Testing SMS via backend API...', 'info');
                const smsResponse = await fetch('/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: '+250792104984',
                        body: 'DEBUG TEST - Backend API SMS test from Communications Hub debug',
                        channel: 'sms'
                    })
                });

                if (smsResponse.ok) {
                    const result = await smsResponse.json();
                    log(`✅ Backend SMS API working!`, 'success');
                    log(`   SID: ${result.sid}`, 'success');
                } else {
                    const error = await smsResponse.json();
                    log(`❌ Backend SMS API failed: ${error.error}`, 'error');
                    log(`   This is expected - SMS needs number verification`, 'warning');
                }

                setStatus('✅ Backend API test completed', 'success');

            } catch (error) {
                log(`❌ Backend API test error: ${error.message}`, 'error');
                setStatus('❌ Backend API test failed', 'error');
            }
        }

        async function testAlertService() {
            log('📡 Testing alertMessagingService...', 'info');
            setStatus('Testing alert service...', 'warning');

            try {
                // Check if alertMessagingService is available
                if (typeof window.alertMessagingService === 'undefined') {
                    log('❌ alertMessagingService not found in window', 'error');
                    log('💡 This service is only available in the main app context', 'warning');
                    setStatus('❌ Alert service not available', 'error');
                    return;
                }

                const alertService = window.alertMessagingService;
                
                // Check recipients
                const recipients = alertService.getRecipients();
                log(`📊 Found ${recipients.length} recipients:`, 'info');
                recipients.forEach(r => {
                    log(`   • ${r.name} (${r.role}) - ${r.region}`, 'info');
                    log(`     SMS: ${r.sms}, WhatsApp: ${r.whatsapp}`, 'info');
                });

                // Test sending alert
                const testAlert = {
                    id: `debug-${Date.now()}`,
                    title: '🧪 DEBUG TEST ALERT',
                    message: 'This is a debug test of the alertMessagingService from Communications Hub',
                    urgency: 'critical',
                    category: 'security_threat',
                    timestamp: new Date(),
                    region: 'Debug Region'
                };

                log('🚨 Sending test alert via alertMessagingService...', 'warning');
                const results = await alertService.sendCriticalAlert(testAlert, ['primary-contact-01']);
                
                log(`📊 Alert results:`, 'info');
                results.forEach(result => {
                    log(`   Recipient: ${result.recipientId}`, 'info');
                    log(`   Overall Status: ${result.overallStatus}`, 'info');
                    if (result.whatsapp) {
                        log(`   WhatsApp: ${result.whatsapp.status}`, result.whatsapp.status === 'sent' ? 'success' : 'error');
                    }
                    if (result.sms) {
                        log(`   SMS: ${result.sms.status}`, result.sms.status === 'sent' ? 'success' : 'error');
                    }
                });

                setStatus('✅ Alert service test completed', 'success');

            } catch (error) {
                log(`❌ Alert service test error: ${error.message}`, 'error');
                setStatus('❌ Alert service test failed', 'error');
            }
        }

        async function testFullFlow() {
            log('🚀 Testing full Communications Hub flow...', 'info');
            setStatus('Testing full flow...', 'warning');

            // First test backend
            await testBackendAPI();
            
            // Wait a bit
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            // Then test alert service
            await testAlertService();
            
            log('🎯 Full flow test completed!', 'success');
            log('', 'info');
            log('📋 DEBUGGING CHECKLIST:', 'warning');
            log('1. ✅ Backend API should be working (WhatsApp yes, SMS needs verification)', 'info');
            log('2. ❓ Alert service should have 1 recipient with your number', 'info');
            log('3. ❓ Alert service should send WhatsApp successfully', 'info');
            log('', 'info');
            log('💡 If alert service fails, the issue is in the frontend service', 'warning');
            log('💡 If backend works but service fails, check the service implementation', 'warning');
        }

        function clearLog() {
            document.getElementById('log').textContent = '';
            document.getElementById('status').textContent = '';
        }

        // Auto-load message
        window.addEventListener('load', () => {
            log('🔍 Communications Hub Alert Debug Tool Loaded', 'info');
            log('', 'info');
            log('🎯 This tool will help debug why alerts are not sending', 'info');
            log('', 'info');
            log('TESTS AVAILABLE:', 'info');
            log('1. 🔧 Backend API - Test Twilio API directly', 'info');
            log('2. 📡 Alert Service - Test alertMessagingService', 'info');
            log('3. 🚀 Full Flow - Test both in sequence', 'info');
            log('', 'info');
            log('💡 Run these tests to identify where the issue is', 'warning');
        });
    </script>
</body>
</html>
