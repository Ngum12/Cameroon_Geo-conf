<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Communications Hub Alert Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff88;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1a1a2e;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #00ff88;
        }
        h1 {
            text-align: center;
            color: #ff1744;
            text-shadow: 0 0 10px #ff1744;
        }
        button {
            background: #ff1744;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
            width: 100%;
        }
        button:hover {
            background: #d50000;
            transform: scale(1.02);
        }
        .success-btn {
            background: #4caf50;
        }
        .success-btn:hover {
            background: #388e3c;
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .instruction {
            background: #3a3a5e;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid #2196f3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 SIMPLE COMMUNICATIONS HUB ALERT TEST</h1>
        
        <div class="instruction">
            <h4>🎯 Quick Test Instructions:</h4>
            <ol>
                <li><strong>Step 1:</strong> Click "Test Backend API" to verify Twilio is working</li>
                <li><strong>Step 2:</strong> Click "Test Full Flow" to test the complete escalation</li>
                <li><strong>Step 3:</strong> Check your phone for WhatsApp messages</li>
            </ol>
        </div>
        
        <button onclick="testBackendOnly()" class="success-btn">🔧 TEST BACKEND API ONLY</button>
        <button onclick="testFullEscalationFlow()">🚀 TEST FULL ESCALATION FLOW</button>
        <button onclick="clearLog()">🧹 CLEAR LOG</button>
        
        <div id="log" class="log"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            logDiv.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function testBackendOnly() {
            log('🔧 Testing backend Twilio API only...', 'info');
            
            try {
                // Test WhatsApp
                log('💬 Sending WhatsApp via backend API...', 'info');
                const response = await fetch('/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: 'whatsapp:+250792104984',
                        body: '🧪 SIMPLE TEST - Backend API WhatsApp from Communications Hub',
                        channel: 'whatsapp'
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    log(`✅ Backend WhatsApp sent successfully!`, 'success');
                    log(`   SID: ${result.sid}`, 'success');
                    log(`   Status: ${result.status}`, 'success');
                    log('📱 Check your phone for WhatsApp message!', 'success');
                } else {
                    const error = await response.json();
                    log(`❌ Backend API failed: ${error.error}`, 'error');
                }

            } catch (error) {
                log(`❌ Backend test error: ${error.message}`, 'error');
            }
        }

        async function testFullEscalationFlow() {
            log('🚀 Testing full escalation flow...', 'info');
            log('', 'info');
            
            // Step 1: Test backend first
            log('STEP 1: Testing backend API...', 'warning');
            await testBackendOnly();
            
            // Wait a bit
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            // Step 2: Test escalation
            log('', 'info');
            log('STEP 2: Running escalation test...', 'warning');
            
            try {
                if (typeof window.testEscalation !== 'undefined' && window.testEscalation.single) {
                    log('✅ Found testEscalation.single() function', 'success');
                    
                    // Run the escalation test
                    window.testEscalation.single();
                    
                    log('✅ Escalation test executed!', 'success');
                    log('', 'info');
                    log('📋 NEXT STEPS TO COMPLETE THE FLOW:', 'warning');
                    log('1. Go to Human-in-Loop Verification tab', 'info');
                    log('2. Click APPROVE on the critical threat', 'info');
                    log('3. Go to Communications Hub tab', 'info');
                    log('4. Select the approved threat', 'info');
                    log('5. Click ALERT button', 'info');
                    log('6. Check console for debugging messages', 'info');
                    log('7. Check your phone for WhatsApp message', 'info');
                    log('', 'info');
                    log('🔍 DEBUGGING: Watch browser console for:', 'warning');
                    log('   - "Communications Hub: Attempting to send alert"', 'info');
                    log('   - "Communications Hub: Alert service results"', 'info');
                    log('   - Any error messages', 'info');
                    
                } else {
                    log('❌ testEscalation.single() not found', 'error');
                    log('💡 Make sure you are on the main dashboard page', 'warning');
                }
                
            } catch (error) {
                log(`❌ Escalation test error: ${error.message}`, 'error');
            }
        }

        function clearLog() {
            document.getElementById('log').textContent = '';
        }

        // Auto-load message
        window.addEventListener('load', () => {
            log('📱 Simple Communications Hub Alert Test Loaded', 'info');
            log('', 'info');
            log('🎯 This will test both backend API and full escalation flow', 'info');
            log('', 'info');
            log('READY TO TEST!', 'success');
        });
    </script>
</body>
</html>
