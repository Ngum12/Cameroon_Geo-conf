<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Debug Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff88;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1a1a2e;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #00ff88;
        }
        h1 {
            text-align: center;
            color: #ff1744;
            text-shadow: 0 0 10px #ff1744;
        }
        .test-section {
            background: #2a2a3e;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
        }
        button {
            background: #ff1744;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #d50000;
            transform: scale(1.05);
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .warning { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 SMS DEBUG TEST</h1>
        
        <div class="test-section">
            <h3>🔍 Debug SMS vs WhatsApp</h3>
            <p>Let's test both channels separately to see what's happening.</p>
            
            <button onclick="testSMSOnly()">📱 TEST SMS ONLY</button>
            <button onclick="testWhatsAppOnly()">💬 TEST WHATSAPP ONLY</button>
            <button onclick="testBothChannels()">🚀 TEST BOTH CHANNELS</button>
            <button onclick="testCommHubService()">🎯 TEST COMMS HUB SERVICE</button>
            <button onclick="clearLog()">🧹 CLEAR LOG</button>
            
            <div id="status"></div>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            logDiv.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function setStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }

        async function testSMSOnly() {
            log('📱 Testing SMS ONLY...', 'info');
            setStatus('Testing SMS...', 'warning');

            try {
                const response = await fetch('/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: '+250792104984',
                        body: 'SMS DEBUG TEST - This is an SMS-only test from the Communications Hub debug tool.',
                        channel: 'sms'
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    log(`✅ SMS sent successfully!`, 'success');
                    log(`   SID: ${result.sid}`, 'success');
                    log(`   Status: ${result.status}`, 'success');
                    log(`   To: ${result.to}`, 'success');
                    log(`   From: ${result.from}`, 'success');
                    setStatus('✅ SMS test successful!', 'success');
                } else {
                    const error = await response.json();
                    log(`❌ SMS failed: ${JSON.stringify(error)}`, 'error');
                    setStatus('❌ SMS test failed', 'error');
                }
            } catch (error) {
                log(`❌ SMS network error: ${error.message}`, 'error');
                setStatus('❌ Network error', 'error');
            }
        }

        async function testWhatsAppOnly() {
            log('💬 Testing WhatsApp ONLY...', 'info');
            setStatus('Testing WhatsApp...', 'warning');

            try {
                const response = await fetch('/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: 'whatsapp:+250792104984',
                        body: 'WHATSAPP DEBUG TEST - This is a WhatsApp-only test from the Communications Hub debug tool.',
                        channel: 'whatsapp'
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    log(`✅ WhatsApp sent successfully!`, 'success');
                    log(`   SID: ${result.sid}`, 'success');
                    log(`   Status: ${result.status}`, 'success');
                    log(`   To: ${result.to}`, 'success');
                    log(`   From: ${result.from}`, 'success');
                    setStatus('✅ WhatsApp test successful!', 'success');
                } else {
                    const error = await response.json();
                    log(`❌ WhatsApp failed: ${JSON.stringify(error)}`, 'error');
                    setStatus('❌ WhatsApp test failed', 'error');
                }
            } catch (error) {
                log(`❌ WhatsApp network error: ${error.message}`, 'error');
                setStatus('❌ Network error', 'error');
            }
        }

        async function testBothChannels() {
            log('🚀 Testing BOTH channels sequentially...', 'info');
            setStatus('Testing both channels...', 'warning');

            // Test SMS first
            await testSMSOnly();
            
            // Wait a bit
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            // Test WhatsApp
            await testWhatsAppOnly();
            
            log('🎯 Both channel tests completed!', 'info');
        }

        async function testCommHubService() {
            log('🎯 Testing Communications Hub Service...', 'info');
            setStatus('Testing Comms Hub Service...', 'warning');

            try {
                // Import the alertMessagingService (simulate what the real app does)
                log('📡 Simulating Communications Hub alert...', 'info');
                
                const testAlert = {
                    id: `comms-test-${Date.now()}`,
                    title: '🚨 COMMUNICATIONS HUB DEBUG TEST',
                    message: `COMMUNICATIONS HUB SERVICE TEST

This is a test of the Communications Hub service integration.

REGION: Debug Region
THREAT LEVEL: 95%
VERIFICATION: DEBUG TEST

TIME: ${new Date().toLocaleString()}

Testing both SMS and WhatsApp channels through the Communications Hub service.

Project Sentinel Defense Intelligence Platform
Cameroon Defense Force`,
                    urgency: 'critical',
                    category: 'security_threat',
                    timestamp: new Date(),
                    region: 'Debug Region'
                };

                // Test SMS via service
                log('📱 Testing SMS via Communications Hub service...', 'info');
                const smsResponse = await fetch('/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: '+250792104984',
                        body: `${testAlert.title}\n\n${testAlert.message}`,
                        channel: 'sms'
                    })
                });

                if (smsResponse.ok) {
                    const smsResult = await smsResponse.json();
                    log(`✅ Comms Hub SMS: ${smsResult.sid}`, 'success');
                } else {
                    const smsError = await smsResponse.json();
                    log(`❌ Comms Hub SMS failed: ${smsError.error}`, 'error');
                }

                // Test WhatsApp via service
                log('💬 Testing WhatsApp via Communications Hub service...', 'info');
                const whatsappResponse = await fetch('/api/v1/twilio/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: 'whatsapp:+250792104984',
                        body: `${testAlert.title}\n\n${testAlert.message}`,
                        channel: 'whatsapp'
                    })
                });

                if (whatsappResponse.ok) {
                    const whatsappResult = await whatsappResponse.json();
                    log(`✅ Comms Hub WhatsApp: ${whatsappResult.sid}`, 'success');
                } else {
                    const whatsappError = await whatsappResponse.json();
                    log(`❌ Comms Hub WhatsApp failed: ${whatsappError.error}`, 'error');
                }

                setStatus('✅ Communications Hub service test completed!', 'success');
                log('🎉 Communications Hub service test completed!', 'success');

            } catch (error) {
                log(`❌ Communications Hub service error: ${error.message}`, 'error');
                setStatus('❌ Service test failed', 'error');
            }
        }

        function clearLog() {
            document.getElementById('log').textContent = '';
            document.getElementById('status').textContent = '';
        }

        // Auto-test on page load
        window.addEventListener('load', () => {
            log('🚀 SMS Debug Test Page Loaded', 'info');
            log('📱 Ready to debug SMS vs WhatsApp!', 'info');
            log('🔍 Click buttons above to test individual channels', 'info');
        });
    </script>
</body>
</html>
